<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Energy Innovation Summit 2026 · Gurobi × Empa</title>
    <meta
      name="description"
      content="Slides for the Gurobi × Empa Energy Innovation Summit 2026."

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />
    <link rel="stylesheet" href="vendor/reveal.js/dist/reset.css" />
    <link rel="stylesheet" href="vendor/reveal.js/dist/reveal.css" />
    <link rel="stylesheet" href="css/theme.css?v=20261119-merit" />
  </head>
  <body>
    <div class="deck-bg" aria-hidden="true">
      <div class="step step-1"></div>
      <div class="step step-2"></div>
      <div class="step step-3"></div>
      <div class="step step-4"></div>
    </div>

    <div class="reveal">
      <div class="slides">
        <section
          data-markdown="slides.md"
          data-separator="^---$"
          data-separator-vertical="^--$"
          data-separator-notes="^Note:"
        ></section>

    </div>

    <script src="vendor/reveal.js/dist/reveal.js"></script>
    <script src="vendor/reveal.js/plugin/markdown/markdown.js"></script>

    <script src="vendor/reveal.js/plugin/math/math.js"></script>
    <script src="js/program.js"></script>
    <script>
      Reveal.initialize({
        hash: true,
        slideNumber: "c/t",
        width: 1920,
        height: 1080,
        margin: 0,
        minScale: 0.2,
        maxScale: 2.0,
        center: false,
        transition: "fade",
        backgroundTransition: "none",
        katex: { version: "0.16.22" },
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes, RevealMath.KaTeX],
      });
    </script>
  </body>
